name: Manual CLI Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: "v0.3.0-alpha.3"
      release-name:
        description: Release title
        required: true
        default: "Actlane CLI v0.3.0-alpha.3"
      go-version:
        description: Go version to use
        required: true
        default: "1.22.x"
      draft:
        description: Create or update release as draft
        required: true
        type: boolean
        default: false
      prerelease:
        description: Mark release as prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: actlane-linux-amd64
            artifact: actlane-linux-amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: actlane-linux-arm64
            artifact: actlane-linux-arm64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            binary: actlane-darwin-amd64
            artifact: actlane-darwin-amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary: actlane-darwin-arm64
            artifact: actlane-darwin-arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary: actlane-windows-amd64.exe
            artifact: actlane-windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: packages/cli/go.sum

      - name: Test
        working-directory: packages/cli
        run: go test ./...

      - name: Build
        working-directory: packages/cli
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.artifact }}/${{ matrix.binary }} ./cmd/actlane

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist

      - name: Prepare Checksums
        shell: bash
        working-directory: release-dist
        run: |
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release-name }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          edit_args=()
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
            edit_args+=(--draft)
          else
            edit_args+=(--draft=false)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
            edit_args+=(--prerelease)
          else
            edit_args+=(--prerelease=false)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$RELEASE_NAME" "${edit_args[@]}"
          else
            gh release create "$TAG" --title "$RELEASE_NAME" --notes "Manual Actlane CLI build." "${args[@]}"
          fi

          gh release upload "$TAG" release-dist/*/* release-dist/SHA256SUMS --clobber
