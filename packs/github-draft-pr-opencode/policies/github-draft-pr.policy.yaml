$schema: https://actlane.ru/schemas/v1alpha1/tool-call-policy.schema.json
apiVersion: actlane.ru/v1alpha1
kind: ToolCallPolicy
metadata:
  name: github-draft-pr-policy
  description: Safe defaults and denials for GitHub draft pull request creation.
spec:
  allow:
    - action: create-github-draft-pr
      when:
        confirmed: true
  deny:
    - reason: Too many files for a safe draft PR automation pass.
      maxFiles: 20
    - reason: Diff too large for draft PR automation.
      maxDiffBytes: 120000
    - reason: Secret or credential paths are blocked.
      paths:
        - .env
        - .env.*
        - "**/*secret*"
        - "**/*credential*"
        - "**/*token*"
        - "**/id_rsa"
        - "**/id_ed25519"
  mutate:
    - field: branch
      ensurePrefix: actlane/
      reason: Branches created by this pack must be recognizable.
    - field: draft
      value: true
      reason: GitHub PRs created by this pack must start as draft.
  requiresApproval:
    - mutating: true
      reason: Creating branches, commits, and GitHub pull requests changes remote state.
  audit:
    include:
      - repo
      - title
      - branch
      - files
      - policyDecision
      - mutations
