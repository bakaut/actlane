$schema: https://actlane.ru/schemas/v1alpha1/capability-pack.schema.json
apiVersion: actlane.ru/v1alpha1
kind: CapabilityPack
metadata:
  name: github-draft-pr-opencode
  version: 0.1.0-alpha.1
  description: OpenCode capability pack for safe GitHub draft pull requests.
spec:
  capabilities:
    - capabilities/create-github-draft-pr.yaml
  policies:
    - policies/github-draft-pr.policy.yaml
  targetProfiles:
    - target-profiles/opencode.yaml
  targets:
    - opencode
  adoptionProfile:
    writePolicy:
      default: neverOverwrite
    requireExplicitApply: true
    removeOnlyOwnedFiles: true
