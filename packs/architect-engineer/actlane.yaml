apiVersion: actlane.ru/v1alpha1
kind: CapabilityPack
metadata:
  name: architect-engineer
  version: 0.1.0-rfc
  description: Codex architect mode that prepares engineer handoffs without writing production code.
spec:
  status: phase-0-rfc
  implementation: handwritten-example
  capabilities:
    - capabilities/architect-engineer-handoff.yaml
  policies:
    - policies/architect-boundary.policy.yaml
  targets:
    - agents-md
    - skill-md
    - mcp
    - codex
  adoptionProfile:
    writePolicy:
      default: neverOverwrite
    requireExplicitApply: true
    removeOnlyOwnedFiles: true
    ownership:
      markers: true
    backups:
      enabled: true

