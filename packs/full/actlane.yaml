$schema: https://actlane.ru/schemas/v1alpha1/capability-pack.schema.json
apiVersion: actlane.ru/v1alpha1
kind: CapabilityPack

metadata:
  name: github-draft-pr-pack
  version: 0.3.0-alpha.17
  description: Project-local agent capability pack for safe GitHub draft pull requests.

spec:
  guidance:
    sources:
      - name: base
        path: files/prompts/BASE.MD
        role: base-instructions

      - name: actlane
        path: files/prompts/ACTLANE.MD
        role: actlane-instructions

      - name: project
        path: files/prompts/AGENTS.md
        role: project-instructions

    compose:
      enabled: true
      output: AGENTS.md
      strategy: concatenate
      order:
        - base
        - actlane
        - project

  capabilities:
    - capabilities/full.yaml

  skills:
    - skills/create-github-draft-pr.yaml
    - skills/dushnila.yaml
    - skills/scope-governor.yaml

  commands:
    - commands/full.yaml

  agents:
    - subagents/full.yaml

  contracts:
    - contracts/full.yaml

  runtimeProfiles:
    - runtime-profiles/full.yaml

  evidence:
    - evidence/full.yaml

  policies:
    - policies/full.yaml

  mcpBindings:
    - mcp/bindings/safe-gitops.yaml
    - mcp/bindings/mcp-broker.yaml
    - mcp/bindings/mcp-pack-author.yaml
    - mcp/bindings/mcp-draft-pr.yaml

  targetProfiles:
    - target-profiles/codex.yaml
    - target-profiles/opencode.yaml

  targets:
    - codex
    - opencode
