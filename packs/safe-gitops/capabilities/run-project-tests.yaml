apiVersion: actlane.dev/v1alpha1
kind: Capability
metadata:
  name: run-project-tests
  description: Run configured project tests before preparing a PR.
spec:
  whenToUse: Use before creating a draft PR when the project has a known test command.
  inputs:
    repo:
      type: string
      required: true
    command:
      type: string
      required: true
    timeoutSeconds:
      type: integer
      default: 600
  outputs:
    exitCode:
      type: integer
    outputSummary:
      type: string
  policies:
    - block-secrets
  toolFlow:
    - tool: sandbox.run_tests
      purpose: execute configured test command
  targets:
    - mcp
    - skill-md
  reporting:
    includeExitCode: true
    includeFailureSummary: true
