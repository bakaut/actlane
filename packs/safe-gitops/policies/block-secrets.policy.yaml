apiVersion: actlane.ru/v1alpha1
kind: ToolCallPolicy
metadata:
  name: block-secrets
spec:
  deny:
    - reason: Environment files may contain secrets.
      paths:
        - .env
        - .env.*
    - reason: Secret or credential paths are blocked.
      paths:
        - "**/*secret*"
        - "**/*credential*"
        - "**/*token*"
        - "**/id_rsa"
        - "**/id_ed25519"
  audit:
    include:
      - deniedPath
      - reason
