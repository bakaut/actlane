$schema: https://actlane.ru/schemas/v1alpha1/mcp-binding.schema.json
apiVersion: actlane.ru/v1alpha1
kind: MCPBinding

metadata:
  name: actlane-safe-gitops
  title: Actlane Safe GitOps MCP Binding
  description: Local Actlane MCP server for policy validation and mutation.

spec:
  capabilityRef:
    name: create-github-draft-pr

  mcpservers:
    - name: actlane-safe-gitops
      provider: actlane
      source: local
      transport: stdio
      command:
        - actlane
      args:
        - mcp
        - serve
        - --pack
        - ./actlane.yaml

  requiredTools: []

  strategy:
    type: builtin
    handler: actlane.policy.evaluate

  generatedTools:
    - name: create_github_draft_pr_audit
      mode: audit
      description: Validate and mutate a GitHub draft PR request without enforcing side effects.
    - name: create_github_draft_pr_enforce
      mode: enforce
      description: Validate and mutate a GitHub draft PR request and fail when policy denies it.
