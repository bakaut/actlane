apiVersion: actlane.ru/v1alpha1
kind: AgentContract

metadata:
  name: github-draft-pr
  description: Specialized agent for preparing safe GitHub draft pull requests.

spec:
  scope: project
  mode: subagent

  role:
    summary: Prepare GitHub draft pull requests through Actlane capabilities.

  activation:
    whenToUse:
      - User asks to prepare a GitHub draft pull request.
      - A primary agent needs a safe PR creation specialist.

  capabilities:
    allowed:
      - create-github-draft-pr

  skills:
    allowed:
      - create-github-draft-pr
      - dushnila

  tools:
    strategy: capability-only
    rawMcpTools:
      default: deny
