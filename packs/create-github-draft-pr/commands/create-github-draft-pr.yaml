apiVersion: actlane.ru/v1alpha1
kind: CommandContract

metadata:
  name: create-github-draft-pr
  title: Create GitHub Draft PR
  description: Prepare a safe GitHub draft pull request from reviewed changes.

spec:
  scope: project

  invocation:
    slash: create-github-draft-pr
    aliases:
      - safe-pr

  capabilityRef:
    name: create-github-draft-pr

  skillRef:
    path: skills/create-github-draft-pr/SKILL.md

  agentRef:
    name: github-draft-pr
    optional: true

  arguments:
    mode: passthrough
    placeholder: "$ARGUMENTS"
    description: User request or PR preparation context.

  prompt:
    template: |
      Use Actlane capability `create-github-draft-pr`.

      Before execution:
      - inspect the project;
      - summarize reviewed changes;
      - run tests when configured;
      - verify explicit user confirmation;
      - do not bypass Actlane policy.

      User request:

      {{ arguments }}

  output:
    expected:
      - prUrl
      - branch
      - changedFiles
      - policyDecision
      - summary

  safety:
    requirePolicy: true
    requireConfirmation: true
    doNotBypassCapability: true

  projections:
    opencode:
      enabled: true
      path: .opencode/commands/create-github-draft-pr.md

    codex:
      enabled: false
      reason: Prefer Skill projection because reusable custom prompts are deprecated in favor of skills.
