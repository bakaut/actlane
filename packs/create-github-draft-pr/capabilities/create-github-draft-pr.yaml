$schema: https://actlane.ru/schemas/v1alpha1/capability.schema.json
apiVersion: actlane.ru/v1alpha1
kind: Capability

metadata:
  name: create-github-draft-pr
  title: Create GitHub Draft PR
  description: Safely prepare a GitHub draft pull request from reviewed changes.
  labels:
    domain: gitops
    risk: medium

spec:
  intent:
    type: mutating

    whenToUse:
      - Use after changes are reviewed and the user asks to prepare a GitHub draft PR.

    whenNotToUse:
      - Do not use for architecture-only discussion.
      - Do not use before explicit user confirmation.
      - Do not use for direct production deploys.

  interface:
    input:
      type: object
      required:
        - repo
        - baseBranch
        - branch
        - title
        - summary
        - files
        - confirmed
      properties:
        repo:
          type: string
          description: Repository in owner/name format, for example bakaut/development.
        baseBranch:
          type: string
          description: Base branch for the pull request.
        branch:
          type: string
          description: Requested branch name. Policy may add a safe prefix.
        title:
          type: string
          description: Pull request title.
        summary:
          type: string
          description: Human-reviewed summary of the change.
        files:
          type: array
          description: Reviewed file paths that may be committed.
          items:
            type: string
        confirmed:
          type: boolean
          description: Must be true after explicit user confirmation.

    output:
      type: object
      properties:
        prUrl:
          type: string
        branch:
          type: string
        policyDecision:
          type: string
        summary:
          type: string
        changedFiles:
          type: array
          items:
            type: string

  policyRef:
    name: github-draft-pr-policy

  executionRef:
    name: github-mcp-draft-pr

  workflowHints:
    - step: inspect-project
      purpose: Inspect current repository, existing agent files, and target agent config before mutation.
    - step: run-tests
      purpose: Run project test command when configured by the user or project.
    - step: create-branch
      purpose: Create a branch using the required safe prefix after confirmation.
    - step: push-files
      purpose: Push reviewed files only after confirmation.
    - step: create-draft-pr
      purpose: Create a GitHub draft pull request after confirmation.

  projections:

    mcp:
      enabled: true
      toolName: create_github_draft_pr

    codex:
      enabled: true
      skill: create-github-draft-pr

    opencode:
      enabled: true
      command: create-github-draft-pr
      agent: github-draft-pr

  reporting:
    includeChangedFiles: true
    includePolicyDecision: true
    includePrUrl: true

  profiles:
    codex:
      config: {}
      files:
        - path: .codex/skills/create-github-draft-pr/SKILL.md
          skillContract: create-github-draft-pr

    opencode:
      config: {}
      files:
        - path: .opencode/commands/create-github-draft-pr.md
          source: create-github-draft-pr.opencode.command.md

        - path: .opencode/agents/github-draft-pr.md
          source: create-github-draft-pr.opencode.agent.md

        - path: .opencode/skills/create-github-draft-pr/SKILL.md
          skillContract: create-github-draft-pr
