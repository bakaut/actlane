$schema: https://actlane.ru/schemas/v1alpha1/target-profile.schema.json
apiVersion: actlane.ru/v1alpha1
kind: TargetProfile

metadata:
  name: opencode

spec:
  target: opencode
  scope: project

  output:
    root: generated/opencode

  install:
    mode: manual-copy
    scope: project
    requireExplicitApply: true
    requireDiffPreview: true

    projectPaths:
      config: opencode.jsonc
      agentsDir: .opencode/agents
      commandsDir: .opencode/commands
      skillsDir: .opencode/skills
      instructionsFile: AGENTS.md

  generate:
    config: true
    instructions: true
    agents: true
    commands: true
    skills: true
    mcp: true

  opencode:
    config:
      filename: opencode.jsonc
      schema: https://opencode.ai/config.json

      instructions:
        - AGENTS.md

      permission:
        bash: ask
        edit: ask
        skill: allow

    files:
      - targetPath: AGENTS.md
        generatedPath: generated/opencode/AGENTS.md
        ownedBlock: true

      - targetPath: opencode.jsonc
        generatedPath: generated/opencode/opencode.jsonc
        owned: true

      - targetPath: .opencode/commands/create-github-draft-pr.md
        generatedPath: generated/opencode/.opencode/commands/create-github-draft-pr.md
        owned: true

      - targetPath: .opencode/agents/github-draft-pr.md
        generatedPath: generated/opencode/.opencode/agents/github-draft-pr.md
        owned: true

      - targetPath: .opencode/skills/create-github-draft-pr/SKILL.md
        generatedPath: generated/opencode/.opencode/skills/create-github-draft-pr/SKILL.md
        owned: true

      - targetPath: actlane.yaml
        generatedPath: generated/opencode/actlane.yaml
        owned: true

      - targetPath: capabilities/create-github-draft-pr.yaml
        generatedPath: generated/opencode/capabilities/create-github-draft-pr.yaml
        owned: true

      - targetPath: policies/github-draft-pr.policy.yaml
        generatedPath: generated/opencode/policies/github-draft-pr.policy.yaml
        owned: true

      - targetPath: mcp/bindings/actlane-safe-gitops.yaml
        generatedPath: generated/opencode/mcp/bindings/actlane-safe-gitops.yaml
        owned: true

      - targetPath: mcp/bindings/github-mcp-draft-pr.yaml
        generatedPath: generated/opencode/mcp/bindings/github-mcp-draft-pr.yaml
        owned: true

      - targetPath: target-profiles/opencode.yaml
        generatedPath: generated/opencode/target-profiles/opencode.yaml
        owned: true

      - targetPath: files/prompts/BASE.MD
        generatedPath: generated/opencode/files/prompts/BASE.MD
        owned: true

      - targetPath: files/prompts/ACTLANE.MD
        generatedPath: generated/opencode/files/prompts/ACTLANE.MD
        owned: true

      - targetPath: files/prompts/AGENTS.md
        generatedPath: generated/opencode/files/prompts/AGENTS.md
        owned: true
