$schema: https://actlane.ru/schemas/v1alpha1/target-profile.schema.json
apiVersion: actlane.ru/v1alpha1
kind: TargetProfile
metadata:
  name: opencode
spec:
  target: opencode
  scope: project
  output:
    root: generated/opencode
  install:
    mode: manual-copy
    scope: project
    requireExplicitApply: true
    requireDiffPreview: true
    projectPaths:
      config: opencode.jsonc
      commandsDir: .opencode/commands
      skillsDir: .opencode/skills
  generate:
    config: true
    instructions: false
    agents: false
    commands: true
    skills: true
    mcp: true
  opencode:
    config:
      filename: opencode.jsonc
      schema: https://opencode.ai/config.json
      permission:
        bash: ask
        edit: ask
        skill: allow
    files:
      - targetPath: opencode.jsonc
        generatedPath: generated/opencode/opencode.jsonc
        owned: true
      - targetPath: policies/policy-bundle.json
        generatedPath: generated/opencode/policies/policy-bundle.json
        owned: true
      - targetPath: broker/broker-bundle.json
        generatedPath: generated/opencode/broker/broker-bundle.json
        owned: true
      - targetPath: .opencode/commands/create-github-draft-pr.md
        generatedPath: generated/opencode/.opencode/commands/create-github-draft-pr.md
        commandContract: create-github-draft-pr
        owned: true
      - targetPath: .opencode/skills/create-github-draft-pr/SKILL.md
        generatedPath: generated/opencode/.opencode/skills/create-github-draft-pr/SKILL.md
        skillContract: create-github-draft-pr
        owned: true
