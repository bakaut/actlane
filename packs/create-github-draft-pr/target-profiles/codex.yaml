$schema: https://actlane.ru/schemas/v1alpha1/target-profile.schema.json
apiVersion: actlane.ru/v1alpha1
kind: TargetProfile
metadata:
  name: codex
spec:
  target: codex
  scope: project
  output:
    root: generated/codex
    config: codex.config.toml
  install:
    mode: manual-copy
    scope: project
    requireExplicitApply: true
    requireDiffPreview: true
    projectPaths:
      configSnippet: .codex/config.toml
      skillsDir: .codex/skills
  generate:
    config: true
    instructions: false
    agents: false
    commands: false
    skills: true
    mcp: true
  codex:
    config:
      filename: codex.config.toml
    files:
      - targetPath: .codex/config.toml
        generatedPath: generated/codex/codex.config.toml
        ownedBlock: true
        markerStyle: hash
      - targetPath: policies/policy-bundle.json
        generatedPath: generated/codex/policies/policy-bundle.json
        owned: true
      - targetPath: broker/broker-bundle.json
        generatedPath: generated/codex/broker/broker-bundle.json
        owned: true
      - targetPath: .codex/skills/create-github-draft-pr/SKILL.md
        generatedPath: generated/codex/.codex/skills/create-github-draft-pr/SKILL.md
        skillContract: create-github-draft-pr
        owned: true
